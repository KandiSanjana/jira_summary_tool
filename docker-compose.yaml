services:
  jira_summary_tool:
    container_name: jira_summary_tool
    build:
      context: .
      dockerfile: Dockerfile
    image: jira_summary_tool:latest
    
    # Load environment variables from .env file
    env_file:
      - .env
    
    # Volume mappings
    volumes:
      - type: bind
        source: ./outputs
        target: /outputs
        read_only: false
    
    # Container configuration
    working_dir: /app
    
    # Health check configuration
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # Usage:
    # 1. Build and start: docker-compose up
    # 2. Run with project: docker-compose run jira_summary_tool --project MYPROJ
    # 3. Override env: docker-compose run -e MODE=development jira_summary_tool
